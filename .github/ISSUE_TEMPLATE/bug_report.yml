name: Bug report
description: Something in Flick doesn't work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Flick version
      description: Shown at the end of Settings, under About.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installed or portable
      options:
        - Installer
        - Portable zip
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera and file type
      description: The photos it happens with.
      placeholder: "Nikon Z6III, NEF"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what Flick did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open a NEF from an SD card
        2. Press X
        3. ...
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if it helps.
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: |
        If Flick showed an error, paste errors.log here. It's in %LOCALAPPDATA%\Flick for the installed version, or in Flick\Data for the portable one. It contains file paths: remove anything you'd rather not share.
      render: text
